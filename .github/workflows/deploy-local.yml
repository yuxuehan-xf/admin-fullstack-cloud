name: 本地自动部署
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, local-vm]
    timeout-minutes: 8
    env:
      # 部署目录：虚拟机实际用户为 saber，课程文档里的 ubuntu 需替换
      APP_DIR: /home/saber/admin-fullstack-cloud
      # 虚拟机远端已改为 SSH，显式指定密钥与免指纹确认，避免自启服务的 HOME 差异
      GIT_SSH_COMMAND: ssh -i /home/saber/.ssh/id_ed25519 -o StrictHostKeyChecking=no
    steps:
      - name: 1. 拉取仓库最新代码
        run: |
          cd "$APP_DIR"
          # 国内网络对 GitHub 存在间歇性 RST，单次 fetch 易失败，故重试 5 次
          ok=0
          for i in 1 2 3 4 5; do
            if git fetch origin main; then ok=1; break; fi
            echo "第 $i 次 git fetch 失败，5 秒后重试..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::git fetch 连续 5 次失败，请检查虚拟机到 GitHub 的网络连通性"
            exit 1
          fi
          git reset --hard origin/main
          echo "=== 当前部署版本 ==="
          git log -1 --oneline
      - name: 2. 检查后端 .env 是否存在
        run: |
          test -f $APP_DIR/backend/.env \
            || { echo "缺少 backend/.env，请按课程文档第三大章 3.2.1 创建后再部署"; exit 1; }
          echo ".env 已存在"
      - name: 3. 校验编排文件语法
        run: |
          cd $APP_DIR
          docker compose -f docker-compose-all.yml config > /dev/null
          echo "compose 文件语法正确"
      - name: 4. 重建并启动全栈服务
        run: |
          cd $APP_DIR
          docker compose -f docker-compose-all.yml up -d --build
      - name: 5. 初始化测试数据（幂等，失败不中断）
        run: |
          sleep 15
          docker exec fastapi-admin python seed_data.py || true
      - name: 6. 输出容器状态
        run: docker ps
      # 新增：手动清理，减少孤儿进程，解决Complete job卡死
      - name: 7. 手动清理残留后台进程
        run: |
          docker system prune -f --filter "until=1m"